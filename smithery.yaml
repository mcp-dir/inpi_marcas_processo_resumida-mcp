# Smithery configuration for INPI: Processo de Registro de Marca (Resumida)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_inpi_marcas_processo_resumida

name: inpi_marcas_processo_resumida-mcp
displayName: "INPI: Processo de Registro de Marca (Resumida)"
description: >
  INPI: Processo de Registro de Marca (Resumida), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/inpi_marcas_processo_resumida-mcp
repository: https://github.com/mcp-dir/inpi_marcas_processo_resumida-mcp

tags:
  - inpi_marcas_processo_resumida
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_inpi_marcas_processo_resumida

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_inpi_marcas_processo_resumida/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
